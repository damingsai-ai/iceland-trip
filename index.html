<style>
:root{--bg:#f6f8fa;--card:#fff;--tx:#1f2933;--mut:#6b7785;--ac:#1971c2;--bd:#dde3ea}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1e242b;--tx:#e6ebf0;--mut:#93a0ad;--ac:#74b3f5;--bd:#333c46}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px/1.5 -apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0}
header a,button{font:inherit;color:var(--ac);background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 9px;cursor:pointer;text-decoration:none}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
#tabs button{flex:none}#tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{flex:1;display:flex;min-height:0}
#map{flex:1.4;min-width:0}
#panel{flex:1;max-width:440px;overflow:auto;padding:12px}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center}
.sum b{display:block;font-size:17px}.sum span{color:var(--mut);font-size:12px}
#road{border-radius:8px;padding:8px 10px;margin-bottom:8px;border:1px solid var(--bd);background:var(--card)}
#road.bad{border-color:#e03131;background:#e0313118}#road.warn{border-color:#f08c00;background:#f08c0018}#road.ok{border-color:#2f9e44;background:#2f9e4418}
.st{display:flex;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px}
.st .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;text-align:center;line-height:24px;font-size:12px}

.st a{font-size:12px;color:var(--ac)}
.pin{background:var(--ac);color:#fff;border:2px solid #fff;border-radius:50%;text-align:center;font:bold 12px/20px sans-serif;width:22px;height:22px}

.dh i{flex:none;width:10px;height:10px;border-radius:50%}.dh .hd{flex:1;min-width:0;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh .sx{flex:none;font-size:12px}.dh .bd{flex:none;min-width:1em}
summary.dh{cursor:pointer}.rm,#pt{padding:1px 8px;font-size:12px;margin:2px 0}.rm.on,#pt.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.db{display:none;padding:0 10px 10px}.day.open .db{display:block}.st{cursor:pointer}
.st.info{border-style:dashed;cursor:default}.st.info .n{background:none;border:1px solid var(--mut);color:var(--mut);line-height:22px}
.st>div:last-child{min-width:0}
#ed.on{background:var(--ac);color:#fff;border-color:var(--ac)}

dialog .acts button{padding:5px 14px}

dialog p{margin:6px 0;font-size:13px}

<body>
<header><h1>🇮🇸 冰島環島 12 天</h1>
<div><button id="ed">✏️ 編輯</button> <button id="xp">⇅ 匯出／匯入</button> <button id="rf">↻ 重新讀取</button> <a href="https://umferdin.is/en" target="_blank" rel="noopener">umferdin.is ↗</a> <a href="https://kort.gis.is/mapview/?app=dronar" target="_blank" rel="noopener">🚁 空拍機地圖 ↗</a></div></header>
<main><div id="map"></div><section id="panel"><div class="sum"><div><b id="s1">—</b><span>全程行車 km</span></div><div><b id="s2">—</b><span>全程開車時間</span></div><div><b id="s3">—</b><span>單日最長</span></div></div>
<p><small>點日期展開當天路線（地圖不縮放）；點路線或景點才會放大。<br>圖例：<b>實線</b>＝行程路線（各天不同的藍綠紫色）；<b style="color:#e03131">紅色虛線</b>＝封路／不可通行；<b style="color:#f08c00">橘色虛線</b>＝惡劣或受限路段。</small></p><div id="src"></div><div id="msg"></div><div id="ebar" hidden></div><div id="list"></div>
<p><small>距離與時間：OSRM 路網計算，已乘 1.15 緩衝；* 表示路線服務無回應，為直線估算。</small></p></section></main>
<dialog id="dlg"><form method="dialog" id="dlgf"></form></dialog><div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ===== 設定 ===== */
const FAERD='https://gagnaveita.vegagerdin.is/api/faerd2017_1';
const WFS='https://gagnaveita.vegagerdin.is/geoserver/gis/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=gis:faerdferlar2017_1&outputFormat=application/json&srsName=EPSG:4326';
const BUFFER=1.15; // 車程緩衝（冬季/碎石路）
/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
const fmt=m=>m>=60?`${Math.floor(m/60)} 小時 ${String(Math.round(m%60)).padStart(2,'0')} 分`:`${Math.round(m)} 分`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== 狀態 ===== */
let DAYS={},cur=1,map,layer,roadLayer,ROAD=null,srcNote='';
const routeCache={};

/* ===== 行程資料庫：GitHub repo 裡的 data/itinerary.json ===== */
const GH=(()=>{const h=location.hostname,p=location.pathname.split('/').filter(Boolean);
 return h.endsWith('.github.io')&&p.length?{o:h.split('.')[0],r:p[0]}:{o:'damingsai-ai',r:'iceland-trip'}})();
const DATA_PATH='data/itinerary.json',API=`https://api.github.com/repos/${GH.o}/${GH.r}/contents/${DATA_PATH}`;
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let TRIP=null,TSHA=null,TSRC='',RELOAD=true;
// 編輯透過 Cloudflare Worker：GitHub token 存在 Worker，網頁只需要行程密碼
const WORKER_URL='https://iceland-trip.damingsai.workers.dev'.replace(/\/+$/,'');
let PW=LS.get('tripPw')||'',ME=LS.get('tripName')||'';
LS.del('ghToken');LS.del('ghUser'); // 舊版存的 GitHub token 不再需要，順手清掉
const wFetch=(p,o={})=>fetch(WORKER_URL+p,{...o,headers:{...(o.headers||{}),'X-Trip-Password':PW},cache:'no-store'});
const OPK='itinOps:'+GH.o+'/'+GH.r;let OPS=LS.get(OPK)||[]; // 尚未儲存的修改
const b64e=s=>{const b=new TextEncoder().encode(s);let t='';for(let i=0;i<b.length;i+=0x8000)t+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(t)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const tmo=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j('逾時'),ms))]);
const ghH=()=>({Accept:'application/vnd.github+json'});
async function ghGet(){ // 讀 repo 裡最新的資料檔；不存在時 data 為 null
 if(PW&&WORKER_URL){ // 編輯者走 Worker：資料最新、也不受 GitHub 每小時次數限制
  const w=await tmo(wFetch('/data'),9000);
  if(w.status===401){PW='';LS.del('tripPw');throw '行程密碼已變更，請重新登入'}
  if(!w.ok)throw 'Worker '+w.status;
  const j=await w.json();return{data:j.content?JSON.parse(b64d(j.content)):null,sha:j.sha}}
 const r=await tmo(fetch(API+'?ref=main',{headers:ghH(),cache:'no-store'}),9000);
 if(r.status===404)return{data:null,sha:null};
 if(!r.ok)throw 'GitHub '+r.status;
 const j=await r.json();return{data:JSON.parse(b64d(j.content)),sha:j.sha}}
async function loadTrip(){ // 回傳 true＝有資料庫；false＝repo 裡還沒有資料檔
 TRIP=null;
 if(navigator.onLine!==false){
  try{const g=await ghGet();TSHA=g.sha;if(g.data){TRIP=g.data;TSRC='GitHub 資料庫（即時）';LS.set('itin',TRIP);return true}return false}catch(e){}
  try{const r=await tmo(fetch(DATA_PATH+'?t='+Date.now(),{cache:'no-store'}),8000);if(r.ok){TRIP=await r.json();TSRC='網站資料檔';LS.set('itin',TRIP);return true}if(r.status===404&&!LS.get('itin'))return false}catch(e){}
 }
 const c=LS.get('itin');if(c){TRIP=c;TSRC='這台裝置上次存的資料（離線）';return true}
 return false}
function tripStops(){ // 資料庫轉成畫面使用的資料列
 const out=[];
 TRIP.days.forEach((d,di)=>{if(!d.items.length)out.push({day:di+1,empty:true});
  d.items.forEach((it,k)=>{const sp=it.spot?TRIP.spots[it.spot]:null,geo=!!(sp&&isFinite(sp.lat)&&isFinite(sp.lng));
   out.push({day:di+1,ord:k,name:it.title||sp?.name||'（未命名）',note:it.note||'',intro:sp?.intro||'',stay:it.stay||'',remind:it.remind||'',
    lat:sp?.lat,lng:sp?.lng,geo,iid:it.id,spot:it.spot||''})})});
 return out}
async function loadSheet(){
 if(RELOAD||!TRIP){RELOAD=false;await loadTrip();if(TRIP)OPS.forEach(o=>applyOp(TRIP,o))}
 if(!TRIP){srcNote='⚠️ 讀不到行程資料（'+esc(DATA_PATH)+'）。請確認網路後按「↻ 重新讀取」。';ITSRC='讀取失敗';return[]}
 srcNote='';ITSRC=TSRC+(TRIP.updated?' · '+new Date(TRIP.updated).toLocaleString('zh-TW',{hour12:false})+(TRIP.by?' 由 '+TRIP.by:'')+' 更新':'');return tripStops()}
let ALLD={};
function group(stops){DAYS={};ALLD={};
 stops.forEach(s=>{ALLD[s.day]??=[];if(!s.empty)ALLD[s.day].push(s);if(s.geo!==false&&isFinite(s.lat)&&isFinite(s.lng))(DAYS[s.day]??=[]).push(s)});
 [DAYS,ALLD].forEach(o=>Object.values(o).forEach(a=>a.sort((p,q)=>p.ord-q.ord)))}

/* ===== 路線（OSRM 公共伺服器） ===== */
const hav=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng);
 const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function route(day){
 const st=DAYS[day],key=st.map(s=>s.lat+','+s.lng).join(';');
 if(routeCache[key])return routeCache[key];
 try{
  const u=`https://router.project-osrm.org/route/v1/driving/${st.map(s=>s.lng+','+s.lat).join(';')}?overview=full&geometries=geojson`;
  const j=await(await fetch(u)).json();if(j.code!=='Ok')throw 0;
  const rt=j.routes[0];
  return routeCache[key]={pts:rt.geometry.coordinates,legs:rt.legs.map(l=>({km:l.distance/1000,min:l.duration/60*BUFFER})),est:false};
 }catch(e){
  const legs=st.slice(1).map((s,i)=>{const km=hav(st[i],s)*1.3;return{km,min:km/70*60*BUFFER}});
  return routeCache[key]={pts:st.map(s=>[s.lng,s.lat]),legs,est:true};
 }
}

/* ===== 路況（Vegagerðin 開放資料，與 umferdin.is 同源） ===== */
const CLOSED=/ófært|lokað|closed|impassable/i,WARN=/þungfært|þæfingur|hálk|snjó|krap|skafrenn|éljag|slippery|snow|icy|heavy|ice/i;
async function loadRoad(){
 try{ // 讀取倉庫裡由 GitHub Actions 每 30 分鐘更新的 road.json（同網域，無跨網域問題）
  const j=await(await fetch('road.json?t='+Date.now())).json();
  if(!j.updated||!j.segs)throw 0;
  ROAD={ok:true,segs:j.segs,at:new Date(j.updated)};
 }catch(e){ROAD={ok:false}}
 await RTP;drawRoad();renderRoad();
}
function drawRoad(){
 roadLayer.clearLayers();if(!ROAD?.ok)return;
 if(roadMode==='off')return;
 const set=new Set(roadMode==='all'?ROAD.segs:Object.values(HIT).flat()); // near=只畫行程路線附近；all=全國
 set.forEach(s=>s.lines.forEach(l=>L.polyline(l.map(p=>[p[1],p[0]]),{color:s.lv==2?'#e03131':'#f08c00',weight:4,opacity:.95,dashArray:'7 6'}).bindPopup(esc(s.name)+'<br>'+esc(s.desc)).addTo(roadLayer)))
}
function dseg(p,a,b){const k=Math.cos(65*Math.PI/180)*111320,X=q=>q[0]*k,Y=q=>q[1]*110574;
 const px=X(p),py=Y(p),ax=X(a),ay=Y(a),bx=X(b),by=Y(b),dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
 let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function near(pts,seg){
 const B=pts.bb||(pts.bb=pts.reduce((b,p)=>[Math.min(b[0],p[0]),Math.min(b[1],p[1]),Math.max(b[2],p[0]),Math.max(b[3],p[1])],[1e9,1e9,-1e9,-1e9]));
 if(!seg.bb){const q=seg.bb=[1e9,1e9,-1e9,-1e9];seg.lines.forEach(l=>l.forEach(p=>{q[0]=Math.min(q[0],p[0]);q[1]=Math.min(q[1],p[1]);q[2]=Math.max(q[2],p[0]);q[3]=Math.max(q[3],p[1])}))}
 if(seg.bb[0]>B[2]+.02||seg.bb[2]<B[0]-.02||seg.bb[1]>B[3]+.02||seg.bb[3]<B[1]-.02)return false;
 for(const l of seg.lines){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;l.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
  const P=.01;for(const p of pts){if(p[0]<x0-P||p[0]>x1+P||p[1]<y0-P||p[1]>y1+P)continue;
   for(let i=1;i<l.length;i++)if(dseg(p,l[i-1],l[i])<300)return true}}
 return false}
const uniq=a=>{const m={};a.forEach(x=>{const k=x.name+x.desc;if(!m[k]||x.lv>m[k].lv)m[k]=x});return Object.values(m).sort((p,q)=>q.lv-p.lv)};
function showRoad(day){
 const el=$('#road');if(!el)return;
 if(!ROAD){el.className='';el.innerHTML='⏳ 讀取路況中…';return}
 if(!ROAD.ok){el.className='warn';el.innerHTML='⚠️ 尚未取得路況資料（road.json 還沒產生，或讀取失敗）。出發前請到 <a href="https://umferdin.is/en" target="_blank">umferdin.is</a> 確認。';return}
 const hits=HIT[day]||[];
 if(!hits.length){el.className='ok';el.innerHTML='✅ 路線附近沒有封路或惡劣路況通報 <small>（'+ROAD.at.toLocaleString('zh-TW',{hour12:false})+' 更新）</small>';return}
 const closed=hits.filter(s=>s.lv==2);
 el.className=closed.length?'bad':'warn';
 el.innerHTML=(closed.length?'⛔ 路線上有封路／不可通行路段':'⚠️ 路線上有惡劣路況')+'<br>'+uniq(hits).slice(0,8).map(x=>`${x.lv==2?'⛔':'⚠️'} ${esc(x.name)}：${esc(x.desc)}`).join('<br>')+'<br><small>詳情請以 umferdin.is 為準</small>'
}
let ITSRC='',roadMode='near';
function badge(d){const h=HIT[d]||[];
 if(h.some(x=>x.lv==2))return'⛔';
 if(h.length)return'⚠️';return ROAD?.ok?'✅':''}
function renderRoad(){
 Object.keys(DAYS).forEach(d=>{const r=RT[d];if(!r)return;
  if(ROAD?.ok)HIT[d]=ROAD.segs.filter(g=>near(r.pts,g))});
 Object.keys(DAYS).forEach(d=>{const e=document.querySelector(`#day${d} .bd`);if(e)e.textContent=RT[d]?badge(d):''});
 drawRoad();updateSrc();
 if(sel)showRoad(sel)
}
function updateSrc(){
 const el=$('#src');if(!el)return;
 const old=ROAD?.ok&&Date.now()-ROAD.at>3*3600e3;

function toCSV(rows){return '﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')+'\r\n'}
function parseCSV(t){t=t.replace(/^﻿/,'');const sep=(t.split('\n')[0].match(/\t/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?'\t':',';

 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"'&&f==='')q=true;else if(c==sep){r.push(f);f=''}else if(c=='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);R.push(r)}return R.filter(x=>x.some(v=>String(v).trim()))}

async function readTable(file){ // 讀匯入的檔案 → 二維陣列

function buildImport(rows){ // 資料列 → 資料庫格式，盡量沿用現有地點
 const hi=rows.findIndex(r=>r.some(v=>/^(day|天)/i.test(String(v).trim()))&&r.some(v=>/地點|景點|顯示名稱/.test(v)));

 const h=rows[hi].map(v=>String(v).trim()),ix=re=>h.findIndex(v=>re.test(v));

 rows.slice(hi+1).forEach((r,k)=>{

  let pos=null;
  if(c.ll>=0&&g(r,'ll'))pos=parseLL(g(r,'ll'));
  else{const x=parseFloat(g(r,'a')),y=parseFloat(g(r,'b'));if(isFinite(x)&&isFinite(y))pos=x>0?{lat:x,lng:y}:{lat:y,lng:x}}

   const cand=byName[name]||[];
