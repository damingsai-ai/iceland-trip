function toStops(rows){

 if(a==='exit'){EDIT=false;init(false);return}
 if(a==='enter'){if(!TOKEN)return loginDialog();EDIT=true;init(false);return}
 if(a==='logout'){if(OPS.length&&!confirm('還有未儲存的修改，登出後仍會保留在這台裝置。確定登出？'))return;TOKEN='';ME='';LS.del('ghToken');LS.del('ghUser');EDIT=false;init(false);return}
 if(a==='import'){if(MODE==='db'&&!confirm('從 Google 試算表重新匯入，會用試算表內容取代目前全部行程。確定？'))return;
  importSheets().then(t=>{doOp({op:'replace',data:t});toast('✅ 已匯入 '+t.days.length+' 天、'+Object.keys(t.spots).length+' 個地點，確認後按「💾 儲存」',6000)}).catch(e=>toast('⚠️ 匯入失敗：'+e,6000));return}
 if(MODE!=='db'||!TRIP)return;
 if(a==='dadd'){doOp({op:'day.add',id:uid('d'),after:null},true);sel=TRIP.days.length;init(false);return}
 if(a==='dins'){doOp({op:'day.add',id:uid('d'),after:dayIdOf(n)},true);sel=n+1;init(false);return}
 if(a==='ddel'){const d=TRIP.days[n-1];if(d.items.length&&!confirm('刪除 Day '+n+'（'+d.items.length+' 個項目）？'))return;doOp({op:'day.del',day:d.id},true);sel=null;init(false);return}
 if(a==='add')return itemDialog(n,null);
 const f=fI(TRIP,id);if(!f)return;const dn=TRIP.days.indexOf(f.d)+1;
 if(a==='edit')return itemDialog(dn,id);
 if(a==='del'){const it=f.d.items[f.i];if(!confirm('刪除「'+(it.title||TRIP.spots[it.spot]?.name||'項目')+'」？'))return;doOp({op:'item.del',id});return}
 if(a==='up'){if(f.i>0)doOp({op:'item.move',id,day:f.d.id,before:f.d.items[f.i-1].id});else if(dn>1)doOp({op:'item.move',id,day:TRIP.days[dn-2].id,before:null});return}
 if(a==='down'){if(f.i<f.d.items.length-1)doOp({op:'item.move',id,day:f.d.id,before:f.d.items[f.i+2]?.id||null});
  else if(dn<TRIP.days.length){const nd=TRIP.days[dn];doOp({op:'item.move',id,day:nd.id,before:nd.items[0]?.id||null})}return}
}
addEventListener('beforeunload',e=>{if(OPS.length&&EDIT){e.preventDefault();e.returnValue=''}});
setInterval(checkRemote,3*60*1000);
init(true);loadRoad();loadAlerts();
setInterval(()=>{loadRoad();loadAlerts()},10*60*1000);
</script>
</body>
</html>
