const SHEET_ID='1ICQiUEd_lRE2XVj3P2cjSl-5XVvHjb6POslXXf6vHYw';

9|彩虹瀑布 Skógafoss||63.53215|-19.511354
9|水濂洞瀑布 Seljalandsfoss||63.615703|-19.988534
9|秘密瀑布 Gljúfrabúi||63.620963|-19.98648
9|塞爾福斯 Selfoss||63.934741|-21.004484
10|塞爾福斯 Selfoss||63.934741|-21.004484
10|火口湖 Kerið||64.041377|-20.885157
10|古佛斯瀑布 Gullfoss||64.327186|-20.119812

10|藍色秘境 Brúarfoss||64.264451|-20.515746
10|辛格韋德利 Þingvellir||64.283199|-21.07614
10|雷克雅維克 Reykjavík（市區）||64.1466|-21.9426
11|雷克雅維克 Reykjavík（市區）||64.1466|-21.9426
11|藍湖溫泉 Blue Lagoon|已預約；沿 41/43 號|63.880783|-22.447296
11|Gunnuhver 地熱區||63.8197|-22.6831
11|雷恰內斯 Reykjanes|燈塔|63.809669|-22.694272

12|凱夫拉維克 Keflavík||64.000317|-22.559835
12|KEF 機場（取車／還車）|還車後搭 18:05 SK2596|63.982742|-22.628024`;

/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
const fmt=m=>m>=60?`${Math.floor(m/60)} 小時 ${String(Math.round(m%60)).padStart(2,'0')} 分`:`${Math.round(m)} 分`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function csv(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);R.push(r)}return R}
function toStops(rows){
 const h=rows[0].map(s=>s.trim()),ix=k=>h.findIndex(x=>x.includes(k));
 const c={d:ix('Day'),o:ix('順序'),n:ix('景點'),r:ix('備註'),i:ix('簡介'),s:ix('預計停留'),m:ix('提醒'),a:ix('經度'),b:ix('緯度')};
 return rows.slice(1).map((r,k)=>{
  const x=parseFloat(r[c.a]),y=parseFloat(r[c.b]);
  // 欄位標題「經度/緯度」可能對調：冰島緯度為正、經度為負，自動判斷
  const lat=x>0?x:y,lng=x>0?y:x;
  return{day:parseInt(r[c.d]),ord:parseFloat(r[c.o])||k,name:(r[c.n]||'').trim(),note:r[c.r]||'',intro:c.i>=0?r[c.i]||'':'',
   stay:c.s>=0?r[c.s]||'':'',remind:c.m>=0?r[c.m]||'':'',lat,lng}
 }).filter(s=>s.day&&s.name&&isFinite(s.lat)&&isFinite(s.lng));
}
function fbStops(){return FB.split('\n').map((l,i)=>{const[d,n,r,la,lo]=l.split('|');return{day:+d,ord:i,name:n,note:r,intro:'',stay:'',remind:'',lat:+la,lng:+lo}})}

/* ===== 狀態 ===== */
let DAYS={},cur=1,map,layer,roadLayer,ROAD=null,srcNote='';
const routeCache={};

async function loadSheet(){
 try{
  const r=await fetch(CSV_URL+'&t='+Date.now());if(!r.ok)throw 0;
  const s=toStops(csv(await r.text()));if(!s.length)throw 0;
  srcNote='';return s;
 }catch(e){srcNote='⚠️ 無法讀取 Google 試算表（請確認已設為「知道連結者可檢視」），目前顯示內建備份資料。';return fbStops()}
}
function group(stops){DAYS={};stops.forEach(s=>(DAYS[s.day]??=[]).push(s));
 Object.values(DAYS).forEach(a=>a.sort((p,q)=>p.ord-q.ord))}

/* ===== 路線（OSRM 公共伺服器） ===== */
const hav=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng);
 const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function route(day){
 const st=DAYS[day],key=st.map(s=>s.lat+','+s.lng).join(';');
 if(routeCache[key])return routeCache[key];
 try{
  const u=`https://router.project-osrm.org/route/v1/driving/${st.map(s=>s.lng+','+s.lat).join(';')}?overview=full&geometries=geojson`;
  const j=await(await fetch(u)).json();if(j.code!=='Ok')throw 0;
  const rt=j.routes[0];
  return routeCache[key]={pts:rt.geometry.coordinates,legs:rt.legs.map(l=>({km:l.distance/1000,min:l.duration/60*BUFFER})),est:false};
 }catch(e){
  const legs=st.slice(1).map((s,i)=>{const km=hav(st[i],s)*1.3;return{km,min:km/70*60*BUFFER}});
  return routeCache[key]={pts:st.map(s=>[s.lng,s.lat]),legs,est:true};
 }
}

/* ===== 路況（Vegagerðin 開放資料，與 umferdin.is 同源） ===== */
const CLOSED=/ófært|lokað|closed|impassable/i,WARN=/þungfært|þæfingur|hálk|snjó|krap|skafrenn|éljag|slippery|snow|icy|heavy|ice/i;
async function loadRoad(){
 try{
  const [a,g]=await Promise.all([fetch(FAERD).then(r=>r.json()),fetch(WFS).then(r=>r.json())]);
  const txt={};
  (Array.isArray(a)?a:a.features||[]).forEach(r=>{r=r.properties||r;const id=r.IdButur;
   (txt[id]??={t:'',n:r.Nafn||r.Lysing||'路段 '+id}).t+=' '+Object.values(r).filter(v=>typeof v==='string').join(' ')});
  const segs=[];
  (g.features||[]).forEach(f=>{const id=f.properties?.IdButur,o=txt[id];if(!o||!f.geometry)return;
   const lv=CLOSED.test(o.t)?2:WARN.test(o.t)?1:0;if(!lv)return;
   const lines=f.geometry.type==='MultiLineString'?f.geometry.coordinates:[f.geometry.coordinates];
   segs.push({lv,name:o.n,desc:o.t.trim().slice(0,120),lines})});
  ROAD={ok:true,segs,at:new Date()};
 }catch(e){ROAD={ok:false}}
 drawRoad();renderRoad();
}
function drawRoad(){
 roadLayer.clearLayers();if(!ROAD?.ok)return;
 ROAD.segs.forEach(s=>s.lines.forEach(l=>L.polyline(l.map(p=>[p[1],p[0]]),{color:s.lv==2?'#e03131':'#f08c00',weight:5,opacity:.8}).bindPopup(esc(s.name)+'<br>'+esc(s.desc)).addTo(roadLayer)))
}
function dseg(p,a,b){const k=Math.cos(65*Math.PI/180)*111320,X=q=>q[0]*k,Y=q=>q[1]*110574;
 const px=X(p),py=Y(p),ax=X(a),ay=Y(a),bx=X(b),by=Y(b),dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
 let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function near(pts,seg){
 for(const l of seg.lines){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;l.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
  const P=.01;for(const p of pts){if(p[0]<x0-P||p[0]>x1+P||p[1]<y0-P||p[1]>y1+P)continue;
   for(let i=1;i<l.length;i++)if(dseg(p,l[i-1],l[i])<300)return true}}
 return false}
async function renderRoad(){
 const el=$('#road');if(!el)return;
 if(!ROAD){el.className='';el.innerHTML='⏳ 讀取路況中…';return}
 if(!ROAD.ok){el.className='warn';el.innerHTML='⚠️ 暫時無法取得即時路況（資料來源可能擋跨網域或離線）。出發前請到 <a href="https://umferdin.is/en" target="_blank">umferdin.is</a> 確認。';return}
 const r=await route(cur),hits=ROAD.segs.filter(s=>near(r.pts,s));
 if(!hits.length){el.className='ok';el.innerHTML='✅ 路線附近沒有封路或惡劣路況通報 <small>（'+ROAD.at.toLocaleTimeString('zh-TW')+' 更新）</small>';return}
 const closed=hits.filter(s=>s.lv==2);
 el.className=closed.length?'bad':'warn';
 el.innerHTML=(closed.length?'⛔ 路線上有封路／不可通行路段':'⚠️ 路線上有惡劣路況')+'<br>'+hits.slice(0,6).map(s=>`${s.lv==2?'⛔':'⚠️'} ${esc(s.name)}：${esc(s.desc)}`).join('<br>')+'<br><small>詳情請以 umferdin.is 為準</small>'
}

/* ===== 畫面 ===== */
const gm=s=>`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
async function show(day){
 cur=day;location.hash='d'+day;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.d===day));
 const st=DAYS[day];layer.clearLayers();
 st.forEach((s,i)=>L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<div class="pin">${i+1}</div>`,iconSize:[22,22]})}).bindPopup(esc(s.name)).addTo(layer));
 map.fitBounds(L.latLngBounds(st.map(s=>[s.lat,s.lng])).pad(.15));
 $('#panel').innerHTML='⏳ 計算路線中…';
 const r=await route(day);if(cur!==day)return;
 L.polyline(r.pts.map(p=>[p[1],p[0]]),{color:'#1971c2',weight:4,opacity:.85}).addTo(layer);
 const km=r.legs.reduce((a,l)=>a+l.km,0),mn=r.legs.reduce((a,l)=>a+l.min,0);
 const mid=st.slice(1,-1).slice(0,8).map(s=>s.lat+','+s.lng).join('|'),f=st[0],l=st[st.length-1];
 const dir=`https://www.google.com/maps/dir/?api=1&origin=${f.lat},${f.lng}&destination=${l.lat},${l.lng}&travelmode=driving${mid?'&waypoints='+mid:''}`;
 $('#panel').innerHTML=(srcNote?`<p>${srcNote}</p>`:'')+
  `<div class="sum"><div><b>${km.toFixed(0)} km</b><span>總里程</span></div><div><b>${fmt(mn)}</b><span>總車程${r.est?'（直線估算）':''}</span></div><div><b>${st.length}</b><span>站數</span></div></div>
  <div id="road"></div>
  <p><a href="${dir}" target="_blank" rel="noopener">🧭 在 Google Maps 開啟整天導航</a></p>`+
  st.map((s,i)=>{const lg=i?r.legs[i-1]:null;
   return`<div class="st"><div class="n">${i+1}</div><div><h3>${esc(s.name)}</h3>
   ${lg?`<div class="leg">距上一站 ${lg.km.toFixed(1)} km · 開車約 ${fmt(lg.min)}</div>`:'<div class="leg">今日起點</div>'}
   ${s.stay?`<div class="leg">預計停留：${esc(s.stay)}</div>`:''}
   ${s.intro?`<div class="note">${esc(s.intro)}</div>`:''}${s.note?`<div class="note">📝 ${esc(s.note)}</div>`:''}
   ${s.remind?`<div class="note">🔔 ${esc(s.remind)}</div>`:''}
   <a href="${gm(s)}" target="_blank" rel="noopener">在 Google Maps 開啟 ↗</a></div></div>`}).join('');
 renderRoad();
}
function tabs(){
 $('#tabs').innerHTML=Object.keys(DAYS).map(d=>`<button data-d="${d}">Day ${d}</button>`).join('');
 $('#tabs').onclick=e=>{const d=e.target.dataset?.d;if(d)show(+d)}
}
async function init(first){
 group(await loadSheet());tabs();
 const h=parseInt((location.hash||'').slice(2));
 show(DAYS[first?h:cur]?(first?h:cur):+Object.keys(DAYS)[0]);
}
map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
layer=L.layerGroup().addTo(map);roadLayer=L.layerGroup().addTo(map);
$('#rf').onclick=()=>{Object.keys(routeCache).forEach(k=>delete routeCache[k]);init(false);loadRoad()};
init(true);loadRoad();
setInterval(loadRoad,10*60*1000);   // 每 10 分鐘更新路況
</script>
</body>
