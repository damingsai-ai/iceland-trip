name: Update road data
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Vegagerdin road data
        run: |
          node --input-type=module <<'EOF'
          import fs from 'fs';
          const H = 'gagnaveita.vegagerdin.is';
          const A = '/api/faerd2017_1';
          const W = '/geoserver/gis/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=gis:faerdferlar2017_1&outputFormat=application/json&srsName=EPSG:4326';
          async function get(path) {
            let err;
            for (const sc of ['https', 'http']) {
              try {
                const r = await fetch(sc + '://' + H + path, { signal: AbortSignal.timeout(90000) });
                if (!r.ok) throw new Error(sc + ' ' + r.status);
                return await r.json();
              } catch (e) { err = e; console.log('failed', sc, path.slice(0, 30), String(e)); }
            }
            throw err;
          }
          const CLOSED = /ófært|ofaert|lokað|lokad|closed|impassable/i;
          const WARN = /þungfært|thungfaert|þæfingur|thaefingur|hálk|halk|snjóþekja|snjothekja|krap|skafrenn|éljag|eljag|fjallab|slippery|snow|icy|heavy/i;
          const [a, g] = await Promise.all([get(A), get(W)]);
          const rows = (Array.isArray(a) ? a : (a.features || [])).map(r => r.properties || r);
          const txt = {};
          const cnt = {};
          for (const r of rows) {
            const o = (txt[r.IdButur] ??= { t: '', s: new Set(), d: new Set(), n: '' });
            o.t += ' ' + Object.values(r).filter(v => typeof v === 'string').join(' ');
            if (r.AstandYfirbord) { o.s.add(r.AstandYfirbord); cnt[r.AstandYfirbord] = (cnt[r.AstandYfirbord] || 0) + 1; }
            for (const k of ['AstandLysingEn', 'AstandLysing', 'AstandVidbotaruppl']) if (r[k]) o.d.add(r[k]);
            o.n ||= r.Nafn || r.Heiti || r.Lysing || r.VegNumer || r.Vegnumer || '';
          }
          const feats = g.features || [];
          // 座標資料的屬性名稱不一定叫 IdButur，所以逐一比對屬性值與 feature id
          const idOf = f => {
            const P = f.properties || {};
            for (const v of Object.values(P)) if (txt[v] !== undefined) return v;
            const m = String(f.id || '').match(/(\d+)$/);
            return m && txt[m[1]] !== undefined ? m[1] : undefined;
          };
          const segs = [];
          let matched = 0;
          for (const f of feats) {
            const id = idOf(f);
            const o = id === undefined ? null : txt[id];
            if (!o || !f.geometry) continue;
            matched++;
            const states = [...o.s];
            const lv = CLOSED.test(o.t) ? 2 : states.some(x => x !== 'GREIDFAERT') ? 1 : WARN.test(o.t) ? 1 : 0;
            if (!lv) continue;
            const lines = f.geometry.type === 'MultiLineString' ? f.geometry.coordinates : [f.geometry.coordinates];
            segs.push({ lv, name: o.n || ('路段 ' + id), desc: ([...o.d].join(' / ') || states.join(',')).slice(0, 160),
              lines: lines.map(l => l.map(p => [+p[0].toFixed(4), +p[1].toFixed(4)])) });
          }
          console.log('records', Object.keys(txt).length, 'features', feats.length, 'matched', matched, 'flagged', segs.length);
          console.log('keys', Object.keys(rows[0] || {}).join(','));
          console.log('states', JSON.stringify(cnt));
          console.log('featsample', JSON.stringify(feats[0] && feats[0].properties).slice(0, 400), 'id=', feats[0] && feats[0].id);
          if (!Object.keys(txt).length || !feats.length) throw new Error('empty data');
          fs.writeFileSync('road.json', JSON.stringify({ updated: new Date().toISOString(), segs }));
          EOF
      - name: Commit
        run: |
          git config user.name "road-bot"
          git config user.email "road-bot@users.noreply.github.com"
          git add road.json
          git commit -m "update road data" || exit 0
          git push