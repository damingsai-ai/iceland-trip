<style>

<style>
:root{--bg:#f6f8fa;--card:#fff;--tx:#1f2933;--mut:#6b7785;--ac:#1971c2;--bd:#dde3ea}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1e242b;--tx:#e6ebf0;--mut:#93a0ad;--ac:#74b3f5;--bd:#333c46}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px/1.5 -apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0}
header a,button{font:inherit;color:var(--ac);background:none;border:1px solid var(--bd);border-radius:6px;padding:3px 9px;cursor:pointer;text-decoration:none}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}

@media(max-width:760px){main{flex-direction:column}#map{flex:none;height:42vh}#panel{max-width:none}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center}
.sum b{display:block;font-size:17px}.sum span{color:var(--mut);font-size:12px}
#road{border-radius:8px;padding:8px 10px;margin-bottom:8px;border:1px solid var(--bd);background:var(--card)}
#road.bad{border-color:#e03131;background:#e0313118}#road.warn{border-color:#f08c00;background:#f08c0018}#road.ok{border-color:#2f9e44;background:#2f9e4418}
.st{display:flex;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px}

<body>
<header><h1>🇮🇸 冰島環島 四方案</h1><nav id="plans" aria-label="切換方案"></nav><span id="net" hidden>📴 離線中</span>
<div><button id="rf">↻ 重新讀取</button> <button id="off">📥 準備離線</button> <a href="https://umferdin.is/en" target="_blank" rel="noopener">umferdin.is ↗</a> <a href="https://kort.gis.is/mapview/?app=dronar" target="_blank" rel="noopener">🚁 空拍機地圖 ↗</a></div></header>
<main><div id="map"></div><section id="panel"><div class="sum"><div><b id="s1">—</b><span>全程行車 km</span></div><div><b id="s2">—</b><span>全程開車時間</span></div><div><b id="s3">—</b><span>單日最長</span></div></div>
<p><small>點日期展開當天路線（地圖不縮放）；點路線或景點才會放大。<br>圖例：<b>實線</b>＝行程路線（各天不同的藍綠紫色）；<b style="color:#e03131">紅色虛線</b>＝封路／不可通行；<b style="color:#f08c00">橘色虛線</b>＝惡劣或受限路段；圓形圖示＝試算表警示。</small></p><div id="src"></div><div id="alerts"></div><div id="msg"></div><div id="list"></div>
<p><small>距離與時間：OSRM 路網計算，已乘 1.15 緩衝；* 表示路線服務無回應，為直線估算。</small></p></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ===== 設定 ===== */
const SHEET_ID='11_OOwwmxWXNXVU_AN5B521HpmTqmnsvCRhFrAbdDkUE'; // 四方案試算表
const PLANS=['A1','B1','A2','B2'];
const ALERT_ID='1-9lTj4DcOgBpVEyOUaailS-b3LVgSvThxH3BRoXx8OY'; // 路況警示試算表
const ALERT_KM=5; // 警示點距路線多少 km 內算「路線附近」
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const FAERD='https://gagnaveita.vegagerdin.is/api/faerd2017_1';
const WFS='https://gagnaveita.vegagerdin.is/geoserver/gis/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=gis:faerdferlar2017_1&outputFormat=application/json&srsName=EPSG:4326';
const BUFFER=1.15; // 車程緩衝（冬季/碎石路）

/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
const fmt=m=>m>=60?`${Math.floor(m/60)} 小時 ${String(Math.round(m%60)).padStart(2,'0')} 分`:`${Math.round(m)} 分`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function csv(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
 if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
 else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'){r.push(f);R.push(r);r=[];f=''}else if(c!='\r')f+=c}
 if(f||r.length){r.push(f);R.push(r)}return R}
let plan='A1';
try{const p=localStorage.getItem('plan');if(PLANS.includes(p))plan=p}catch(e){}
{const m=(location.hash||'').match(/^#(A1|B1|A2|B2)/);if(m)plan=m[1]}
const norm=s=>String(s||'').replace(/^住宿[:：]\s*/,'').replace(/[\s（）()]/g,'').toLowerCase();
// 冰島緯度為正、經度為負；欄位若對調自動修正
function ll(a,b){const x=parseFloat(a),y=parseFloat(b);if(!isFinite(x)||!isFinite(y))return null;return x>0?{lat:x,lng:y}:{lat:y,lng:x}}
function toStops(rows){
 const h=rows[0].map(s=>s.trim()),ix=(k,d)=>{const i=h.findIndex(x=>x.includes(k));return i>=0?i:d};
 const c={d:ix('Day',0),dt:ix('日期',1),t:ix('時間',2),n:ix('景點/事項',3),e:ix('原文',4),a:ix('緯度',5),b:ix('經度',6),m:ix('停留',7),f:ix('用餐',8)};
 return rows.slice(1).map((r,k)=>{
  const day=parseInt((String(r[c.d]||'').match(/\d+/)||[])[0]),name=(r[c.n]||'').trim(),en=(r[c.e]||'').trim();
  const m=look(en,name),pos=ll(r[c.a],r[c.b])||m?.pos||null; // 沒座標時用「景點總覽」補
  return{day,ord:k,date:r[c.dt]||'',time:r[c.t]||'',name,en:en&&en!==name?en:'',remind:r[c.m]||'',meal:r[c.f]||'',
   intro:m?.intro||'',warn:m?.warn&&m.warn!=='-'?m.warn:'',lat:pos?.lat,lng:pos?.lng,geo:!!pos}
 }).filter(s=>s.day&&s.name);
}

/* ===== 狀態 ===== */
let DAYS={},cur=1,map,layer,roadLayer,ROAD=null,srcNote='';
const routeCache={};

let JID=0;
function jsonp0(id,sh){return new Promise((res,rej)=>{
 const n='__gs'+(++JID)+'_'+Date.now(),sc=document.createElement('script');
 const done=()=>{clearTimeout(t);delete window[n];sc.remove()},t=setTimeout(()=>{done();rej('逾時')},12000);
 window[n]=d=>{done();d&&d.status==='ok'?res(d.table):rej('Google 回應錯誤（'+(d&&d.status)+'）')};
 sc.onerror=()=>{done();rej('無法連線')};
 sc.src=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?headers=1${sh?'&sheet='+encodeURIComponent(sh):''}&tqx=responseHandler:${n}&tq=`+encodeURIComponent('select *');
 document.head.appendChild(sc)})}
let STALE=0; // 離線時使用的舊資料時間
function jsonp(id=SHEET_ID,sh=''){const k='gs:'+id+':'+sh;
 return jsonp0(id,sh).then(t=>{try{localStorage.setItem(k,JSON.stringify({at:Date.now(),t}))}catch(e){}return t},
  e=>{let c=null;try{c=JSON.parse(localStorage.getItem(k))}catch(_){}if(c&&c.t){STALE=Math.max(STALE,c.at);return c.t}throw e})}
const cellV=c=>{if(!c)return'';const v=c.v;if(v==null)return c.f||'';return Array.isArray(v)||(typeof v==='string'&&v.startsWith('Date('))?(c.f||String(v)):String(v)};
const rowsOf=t=>[t.cols.map(c=>c.label||''),...t.rows.map(r=>(r.c||[]).map(cellV))];
let MAS={};
async function loadSpots(){
 try{
  const rows=rowsOf(await jsonp(SHEET_ID,'景點總覽')),hi=Math.max(0,rows.findIndex(r=>r.some(x=>x.includes('景點中文'))));
  const h=rows[hi],ix=k=>h.findIndex(x=>x.includes(k));
  const c={zh:ix('景點中文'),en:ix('原文'),a:ix('緯度'),b:ix('經度'),i:ix('說明'),w:ix('注意')};
  MAS={};rows.slice(hi+1).forEach(r=>{const o={pos:ll(r[c.a],r[c.b]),intro:c.i>=0?r[c.i]:'',warn:c.w>=0?r[c.w]:''};
   [r[c.zh],r[c.en]].forEach(k=>{const n=norm(k);if(n)MAS[n]??=o})});
 }catch(e){MAS={}}
}
const look=(...ks)=>{for(const k of ks){const m=MAS[norm(k)];if(m)return m}return null};
const intro=s=>s.intro||'';
async function loadSheet(){
 await loadSpots();
 try{
  const rows=rowsOf(await jsonp(SHEET_ID,'Plan_'+plan)),hi=rows.findIndex(r=>r.some(x=>x.includes('景點')));
  const s=toStops(hi>=0?rows.slice(hi):rows);
  if(s.some(x=>x.geo)){srcNote='';ITSRC='Google 試算表 Plan_'+plan+'（即時）';return s}
  throw '表內沒有可用資料列';
 }catch(e){srcNote='⚠️ 無法讀取 Plan_'+plan+' 分頁（'+e+'）。請確認試算表已設為「知道連結者可檢視」，且分頁名稱沒有改動。';ITSRC='讀取失敗';return[]}
}
let ALLD={},DATES={};
function group(items){DAYS={};ALLD={};DATES={};
 items.forEach(s=>{(ALLD[s.day]??=[]).push(s);if(s.date)DATES[s.day]??=s.date;if(s.geo)(DAYS[s.day]??=[]).push(s)});
 Object.keys(ALLD).forEach(d=>{if(!DAYS[d])delete ALLD[d]})}

/* ===== 路線（OSRM 公共伺服器） ===== */
const hav=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng);
 const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const osrmUrl=st=>`https://router.project-osrm.org/route/v1/driving/${st.map(s=>s.lng+','+s.lat).join(';')}?overview=full&geometries=geojson`;
async function route(day){
 const st=DAYS[day],key=st.map(s=>s.lat+','+s.lng).join(';');
 if(routeCache[key])return routeCache[key];
 try{
  const u=osrmUrl(st);
  const j=await(await fetch(u)).json();if(j.code!=='Ok')throw 0;
  const rt=j.routes[0];
  return routeCache[key]={pts:rt.geometry.coordinates,legs:rt.legs.map(l=>({km:l.distance/1000,min:l.duration/60*BUFFER})),est:false};
 }catch(e){
  const legs=st.slice(1).map((s,i)=>{const km=hav(st[i],s)*1.3;return{km,min:km/70*60*BUFFER}});
  return routeCache[key]={pts:st.map(s=>[s.lng,s.lat]),legs,est:true};
 }
}

/* ===== 路況（Vegagerðin 開放資料，與 umferdin.is 同源） ===== */
const CLOSED=/ófært|lokað|closed|impassable/i,WARN=/þungfært|þæfingur|hálk|snjó|krap|skafrenn|éljag|slippery|snow|icy|heavy|ice/i;
async function loadRoad(){
 try{ // 讀取倉庫裡由 GitHub Actions 每 30 分鐘更新的 road.json（同網域，無跨網域問題）
  const j=await(await fetch('road.json?t='+Date.now())).json();
  if(!j.updated||!j.segs)throw 0;
  ROAD={ok:true,segs:j.segs,at:new Date(j.updated)};
 }catch(e){ROAD={ok:false}}
 await RTP;drawRoad();renderRoad();
}
function drawRoad(){
 roadLayer.clearLayers();if(!ROAD?.ok)return;
 if(roadMode==='off')return;
 const set=new Set(roadMode==='all'?ROAD.segs:Object.values(HIT).flat()); // near=只畫行程路線附近；all=全國
 set.forEach(s=>s.lines.forEach(l=>L.polyline(l.map(p=>[p[1],p[0]]),{color:s.lv==2?'#e03131':'#f08c00',weight:4,opacity:.95,dashArray:'7 6'}).bindPopup(esc(s.name)+'<br>'+esc(s.desc)).addTo(roadLayer)))
}
function dseg(p,a,b){const k=Math.cos(65*Math.PI/180)*111320,X=q=>q[0]*k,Y=q=>q[1]*110574;
 const px=X(p),py=Y(p),ax=X(a),ay=Y(a),bx=X(b),by=Y(b),dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
 let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function near(pts,seg){
 const B=pts.bb||(pts.bb=pts.reduce((b,p)=>[Math.min(b[0],p[0]),Math.min(b[1],p[1]),Math.max(b[2],p[0]),Math.max(b[3],p[1])],[1e9,1e9,-1e9,-1e9]));
 if(!seg.bb){const q=seg.bb=[1e9,1e9,-1e9,-1e9];seg.lines.forEach(l=>l.forEach(p=>{q[0]=Math.min(q[0],p[0]);q[1]=Math.min(q[1],p[1]);q[2]=Math.max(q[2],p[0]);q[3]=Math.max(q[3],p[1])}))}
 if(seg.bb[0]>B[2]+.02||seg.bb[2]<B[0]-.02||seg.bb[1]>B[3]+.02||seg.bb[3]<B[1]-.02)return false;
 for(const l of seg.lines){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;l.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
  const P=.01;for(const p of pts){if(p[0]<x0-P||p[0]>x1+P||p[1]<y0-P||p[1]>y1+P)continue;
   for(let i=1;i<l.length;i++)if(dseg(p,l[i-1],l[i])<300)return true}}
 return false}
const uniq=a=>{const m={};a.forEach(x=>{const k=x.name+x.desc;if(!m[k]||x.lv>m[k].lv)m[k]=x});return Object.values(m).sort((p,q)=>q.lv-p.lv)};
function showRoad(day){
 const el=$('#road');if(!el)return;
 if(!ROAD){el.className='';el.innerHTML='⏳ 讀取路況中…';return}
 if(!ROAD.ok){el.className='warn';el.innerHTML='⚠️ 尚未取得路況資料（road.json 還沒產生，或讀取失敗）。出發前請到 <a href="https://umferdin.is/en" target="_blank">umferdin.is</a> 確認。';return}
 const hits=HIT[day]||[];
 if(!hits.length){el.className='ok';el.innerHTML='✅ 路線附近沒有封路或惡劣路況通報 <small>（'+ROAD.at.toLocaleString('zh-TW',{hour12:false})+' 更新）</small>';return}
 const closed=hits.filter(s=>s.lv==2);
 el.className=closed.length?'bad':'warn';
 el.innerHTML=(closed.length?'⛔ 路線上有封路／不可通行路段':'⚠️ 路線上有惡劣路況')+'<br>'+uniq(hits).slice(0,8).map(x=>`${x.lv==2?'⛔':'⚠️'} ${esc(x.name)}：${esc(x.desc)}`).join('<br>')+'<br><small>詳情請以 umferdin.is 為準</small>'
}
/* ===== 路況警示試算表 ===== */
let ITSRC='',forceSheet=true,roadMode='near',alertLayer,ALERTS=[],ALOK=false,AERR='',AH={},AM=[],AUPD='';
const useSheet=()=>!ROAD?.ok||forceSheet; // 自動排程可用時，預設不顯示試算表警示
const ic=a=>({封路:'⛔',施工:'🚧',限制通行:'🚫',危險:'⚠️'})[a.type]||'❗';
const sevCol=a=>a.sev==='高'?'#e03131':a.sev==='中'?'#f08c00':'#f2c200';
function nearA(pts,a){const k=Math.cos(65*Math.PI/180)*111.32;
 for(const p of pts)if(Math.hypot((p[0]-a.lng)*k,(p[1]-a.lat)*110.57)<=ALERT_KM)return true;return false}
async function loadAlerts(){
 try{
  const t=await jsonp(ALERT_ID),L0=t.cols.map(c=>c.label||'');
  const cell=c=>{if(!c||c.v==null)return'';let v=c.v;if(typeof v==='string'&&v.startsWith('Date('))v=c.f||v;return String(v)};
  const ix=(k,d)=>{const i=L0.findIndex(x=>x.includes(k));return i>=0?i:d};
  const c={id:ix('編號',0),ty:ix('類別',1),sv:ix('嚴重度',2),rd:ix('公路',3),nm:ix('地點',4),ds:ix('說明',5),la:ix('緯度',6),lo:ix('經度',7),st:ix('開始',8),en:ix('結束',9),ss:ix('狀態',10)};
  const today=new Date().toISOString().slice(0,10);
  ALERTS=t.rows.map(r=>{const q=(r.c||[]).map(cell),x=parseFloat(q[c.la]),y=parseFloat(q[c.lo]);
   return{id:q[c.id],type:q[c.ty],sev:q[c.sv],road:q[c.rd],name:q[c.nm],desc:q[c.ds],lat:x>0?x:y,lng:x>0?y:x,start:q[c.st],end:q[c.en],ss:q[c.ss]}})
   .filter(a=>a.id&&isFinite(a.lat)&&isFinite(a.lng)&&!(a.ss&&!a.ss.includes('有效'))&&!(/^\d{4}-/.test(a.end)&&a.end<today))
   .map((a,i)=>({...a,i}));
  AUPD=L0.find(x=>/^\d{4}-\d\d-\d\d/.test(x))||'';ALOK=true;AERR='';
 }catch(e){ALOK=false;AERR=String(e);ALERTS=[]}
 drawAlerts();alertList();renderRoad();
}
function drawAlerts(){
 alertLayer.clearLayers();AM=[];if(!useSheet())return;
 ALERTS.forEach((a,i)=>{AM[i]=L.marker([a.lat,a.lng],{zIndexOffset:1000,icon:L.divIcon({className:'',html:`<div class="al" style="border-color:${sevCol(a)}">${ic(a)}</div>`,iconSize:[26,26]})})
  .bindPopup(`<b>${ic(a)} ${esc(a.type)}（${esc(a.sev)}）</b><br>${esc(a.road)} ${esc(a.name)}<br>${esc(a.desc)}<br><small>${esc(a.start)}～${esc(a.end)}</small><br><a href="https://www.google.com/maps/search/?api=1&query=${a.lat},${a.lng}" target="_blank" rel="noopener">在 Google Maps 開啟</a>`).addTo(alertLayer)})
}
function alertList(){
 const el=$('#alerts');if(!el)return;
 if(!useSheet()){el.innerHTML='';return}
 if(!ALOK){el.innerHTML=AERR?`<p><small>⚠️ 路況警示讀取失敗（${esc(AERR)}）</small></p>`:'';return}
 el.innerHTML=`<details class="day" ${ALERTS.length?'open':''}><summary class="dh"><b>🚧 路況警示</b><span class="hd">${ALERTS.length} 則${AUPD?' · 更新 '+esc(AUPD):''}</span></summary><div class="db" style="display:block">`+
  (ALERTS.map(a=>`<div class="st" data-ai="${a.i}"><div class="n" style="background:${sevCol(a)}">${ic(a)}</div><div><h3>${esc(a.type)}·${esc(a.sev)} ${esc(a.road)} ${esc(a.name)}</h3><div class="note">${esc(a.desc)}</div><div class="leg">${esc(a.start)}～${esc(a.end)}</div></div></div>`).join('')||'目前沒有有效警示')+'</div></details>'
}
function zoomAlert(i){const a=ALERTS[i];if(!a)return;map.setView([a.lat,a.lng],11);AM[i]&&AM[i].openPopup()}
function showAlerts(day){
 const el=$('#alr');if(!el)return;
 if(!useSheet()){el.innerHTML='';return}
 if(!ALOK){el.innerHTML=AERR?`<small>⚠️ 路況警示試算表讀取失敗（${esc(AERR)}）</small>`:'';return}
 const h=AH[day]||[];
 el.innerHTML=h.length?`<small>路線 ${ALERT_KM} km 內的警示（點一下看位置）：</small>`+h.map(a=>`<div class="note al-i" data-ai="${a.i}">${ic(a)} <b>${esc(a.type)}·${esc(a.sev)}</b> ${esc(a.road)} ${esc(a.name)}：${esc(a.desc)} <small>${esc(a.start)}～${esc(a.end)}</small></div>`).join(''):`<small>✅ 路線 ${ALERT_KM} km 內沒有試算表登錄的警示</small>`
}
function badge(d){const h=HIT[d]||[],a=AH[d]||[];
 if(h.some(x=>x.lv==2)||a.some(x=>x.type==='封路'))return'⛔';
 if(h.length||a.length)return'⚠️';return ROAD?.ok||ALOK?'✅':''}
function renderRoad(){
 Object.keys(DAYS).forEach(d=>{const r=RT[d];if(!r)return;
  if(ROAD?.ok)HIT[d]=ROAD.segs.filter(g=>near(r.pts,g));
  AH[d]=useSheet()?ALERTS.filter(a=>nearA(r.pts,a)):[]});
 Object.keys(DAYS).forEach(d=>{const e=document.querySelector(`#day${d} .bd`);if(e)e.textContent=RT[d]?badge(d):''});
 drawRoad();drawAlerts();alertList();updateSrc();
 if(sel){showRoad(sel);showAlerts(sel)}
}
function updateSrc(){
 const el=$('#src');if(!el)return;
 const old=ROAD?.ok&&Date.now()-ROAD.at>3*3600e3;
 let r;
 if(ROAD?.ok)r='📡 路況來源：公路局開放資料（GitHub 排程自動更新，'+ROAD.at.toLocaleString('zh-TW',{hour12:false})+'；目前通報路段 '+ROAD.segs.length+' 段）'+(old?' ⚠️ 超過 3 小時未更新':'');
 else if(ALOK)r='📄 路況來源：Google 試算表「冰島路況」（自動排程資料讀不到，改用備援）';
 else r='⚠️ 路況來源：自動排程與試算表都讀取失敗';
 const nn=new Set(Object.values(HIT).flat()).size,rmHtml=ROAD?.ok?'<br>公路局路況（地圖）：'+[['near','路線附近 '+nn+' 段'],['all','全國 '+ROAD.segs.length+' 段'],['off','隱藏']].map(([m,t])=>`<button class="rm${roadMode===m?' on':''}" data-m="${m}">${t}</button>`).join(' '):'';
 const sh=ALOK&&ROAD?.ok?`<br>試算表警示 ${ALERTS.length} 則：${forceSheet?'顯示中':'未顯示'} <button id="tg">${forceSheet?'隱藏':'同時顯示'}</button>`:'';
 el.innerHTML=`<p><small>${STALE?`📴 <b>離線：顯示 ${new Date(STALE).toLocaleString('zh-TW',{hour12:false})} 存下的行程資料</b><br>`:''}${offInfo()}🗺️ 行程來源：${esc(STALE?'Plan_'+plan+'（離線備份）':ITSRC||'讀取中…')}<br>${r}${rmHtml}${sh}<br>🚁 空拍參考：<button id="pt" class="${protOn?'on':''}">${protOn?'隱藏':'顯示'}受保護區圖層</button> <a href="https://kort.gis.is/mapview/?app=dronar" target="_blank" rel="noopener">官方空拍機地圖 ↗</a><br>受保護區（國家公園、自然保護區）空拍另有規定，但<b>不等於禁飛區地圖</b>，機場限制區與臨時禁飛請以官方地圖和 AIP 為準。</small></p>`;
}

/* ===== 畫面：每天摺疊清單 + 總覽地圖 ===== */
const COL=['#1971c2','#3b5bdb','#7048e8','#ae3ec9','#0c8599','#0ca678','#2f9e44','#1098ad','#5f3dc4','#495057','#364fc7','#087f5b']; // 刻意避開紅/橘/黃（保留給路況警示）
let HOME,RT={},HIT={},sel=null,RTP=Promise.resolve();
const gm=s=>s.geo!==false?`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((s.en||s.name).replace(/^住宿[:：]\s*/,'')+' Iceland')}`;
const sumKm=r=>r.legs.reduce((a,l)=>a+l.km,0),sumMin=r=>r.legs.reduce((a,l)=>a+l.min,0);
const nm=s=>s.name.split(' ')[0];
const latlngs=r=>r.pts.map(p=>[p[1],p[0]]);
function buildList(){
 $('#list').innerHTML=Object.keys(DAYS).map(d=>{const st=DAYS[d];
  return`<div class="day" id="day${d}"><button class="dh" data-d="${d}"><i style="background:${COL[d-1]}"></i><b>Day ${d}${DATES[d]?` <small>${esc(DATES[d])}</small>`:''}</b><span class="hd">${esc(nm(st[0]))} → ${esc(nm(st[st.length-1]))}</span><span class="sx">…</span><span class="bd"></span></button><div class="db"></div></div>`}).join('')
}
function fit(d){map.fitBounds(L.latLngBounds(latlngs(RT[d])).pad(.1),{maxZoom:13})}
function draw(){
 layer.clearLayers();
 (sel?[sel]:Object.keys(DAYS)).forEach(d=>{const r=RT[d];if(!r)return;
  L.polyline(latlngs(r),{color:'#fff',weight:(sel?5:3)+3,opacity:.9,interactive:false}).addTo(layer);
  L.polyline(latlngs(r),{color:COL[d-1],weight:sel?5:3,opacity:sel?.9:.7}).bindTooltip('Day '+d)
   .on('click',()=>sel==d?fit(d):select(+d,true)).addTo(layer);
  if(sel)DAYS[d].forEach((s,i)=>L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:`<div class="pin">${i+1}</div>`,iconSize:[22,22]})})
   .bindPopup((s.time?esc(s.time)+' ':'')+esc(s.name)).on('click',()=>map.setView([s.lat,s.lng],13)).addTo(layer))})
}
function fillBody(day){
 const st=DAYS[day],r=RT[day],b=document.querySelector(`#day${day} .db`);
 if(!r){b.innerHTML='⏳ 計算路線中…';return}
 const mid=st.slice(1,-1).slice(0,8).map(s=>s.lat+','+s.lng).join('|'),f=st[0],l=st[st.length-1];
 const dir=`https://www.google.com/maps/dir/?api=1&origin=${f.lat},${f.lng}&destination=${l.lat},${l.lng}&travelmode=driving${mid?'&waypoints='+mid:''}`;
 let gi=-1;
 b.innerHTML=`<div id="road"></div><div id="alr"></div><p><a href="${dir}" target="_blank" rel="noopener">🧭 在 Google Maps 開啟整天導航</a></p>`+
  ALLD[day].map(s=>{let mark='·',leg,attr='';
   if(s.geo){gi++;mark=gi+1;attr=` data-i="${gi}"`;const lg=gi?r.legs[gi-1]:null;
    leg=lg?`<div class="leg">距上一站 ${lg.km.toFixed(1)} km · 開車約 ${fmt(lg.min)}</div>`:'<div class="leg">今日起點</div>'}
   else leg='<div class="leg">無座標，不列入路線計算</div>';
   return`<div class="st${s.geo?'':' info'}"${attr}><div class="n">${mark}</div><div><h3>${s.time?`<span class="t">${esc(s.time)}</span>`:''}${esc(s.name)}</h3>
   ${s.en?`<div class="en">${esc(s.en)}</div>`:''}${leg}
   ${s.remind?`<div class="note">📝 ${esc(s.remind)}</div>`:''}
   ${s.meal?`<div class="note">🍽 ${esc(s.meal)}</div>`:''}
   ${s.intro?`<div class="note"><small>${esc(s.intro)}</small></div>`:''}
   ${s.warn?`<div class="note">⚠️ ${esc(s.warn)}</div>`:''}
   <a href="${gm(s)}" target="_blank" rel="noopener">在 Google Maps 開啟 ↗</a></div></div>`}).join('');
 showRoad(day);showAlerts(day)
}
function select(day,zoom){
 sel=day;history.replaceState(null,'','#'+plan+(day?'d'+day:''));
 document.querySelectorAll('.day').forEach(e=>e.classList.toggle('open',+e.id.slice(3)===day));
 if(day)fillBody(day);
 draw();
 if(!zoom&&HOME)map.fitBounds(HOME); // 點日期（或收合）一律回到初始全島視角
 if(day){document.getElementById('day'+day).scrollIntoView({block:'nearest',behavior:'smooth'});if(zoom&&RT[day])fit(day)}
}
let GEN=0;
async function loadAll(g){
 let km=0,mn=0,mx=0,mxd=0;
 for(const d of Object.keys(DAYS)){
  const r0=await route(+d);if(g!==GEN)return;const r=RT[d]=r0,k=sumKm(r),m=sumMin(r);km+=k;mn+=m;if(m>mx){mx=m;mxd=d}
  const e=document.querySelector(`#day${d} .sx`);if(e)e.textContent=`${k.toFixed(0)} km · ${fmt(m)}${r.est?'*':''}`;
  if(sel==d)fillBody(d);draw()}
 $('#s1').textContent=km.toFixed(0);$('#s2').textContent=fmt(mn);$('#s3').textContent=`Day ${mxd} · ${fmt(mx)}`;
}
async function init(first){
 const g=++GEN;STALE=0;
 group(await loadSheet());if(g!==GEN)return;RT={};HIT={};updateSrc();
 if(!Object.keys(DAYS).length){buildList();$('#msg').innerHTML=`<p>${srcNote}</p>`;layer.clearLayers();map.setView([64.9,-18.6],6);['#s1','#s2','#s3'].forEach(x=>$(x).textContent='—');return}
 buildList();$('#msg').innerHTML=srcNote?`<p>${srcNote}</p>`:'';
 HOME=L.latLngBounds(Object.values(DAYS).flat().map(s=>[s.lat,s.lng])).pad(.05);map.fitBounds(HOME);
 const h=parseInt(((location.hash||'').match(/d(\d+)/)||[])[1]),want=first?h:sel;
 RTP=loadAll(g);select(DAYS[want]?want:null,false);
 await RTP;renderRoad();
}
map=L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,crossOrigin:true,attribution:'© OpenStreetMap'}).addTo(map);
layer=L.layerGroup().addTo(map);roadLayer=L.layerGroup().addTo(map);alertLayer=L.layerGroup().addTo(map);
let protOn=false;
// 環境署（Umhverfisstofnun）官方 WMS：受保護區。圖片圖層，不需跨網域授權；讀不到時只是不顯示
const protLayer=L.tileLayer.wms('https://gis.ust.is/geoserver/wms',{layers:'fridlyst_svaedi:fridlyst_svaedi',format:'image/png',transparent:true,opacity:.45,attribution:'© Umhverfisstofnun'});
$('#list').onclick=e=>{
 const b=e.target.closest('.dh');if(b){const d=+b.dataset.d;select(sel===d?null:d);return}
 const st=e.target.closest('.st');if(st&&sel&&st.dataset.i!=null&&!e.target.closest('a')){const s=DAYS[sel][+st.dataset.i];map.setView([s.lat,s.lng],13)}
};
$('#panel').addEventListener('click',e=>{const rb=e.target.closest('.rm');if(rb){roadMode=rb.dataset.m;drawRoad();updateSrc();return}if(e.target.id==='pt'){protOn=!protOn;protOn?protLayer.addTo(map):map.removeLayer(protLayer);updateSrc();return}if(e.target.id==='tg'){forceSheet=!forceSheet;renderRoad();return}const x=e.target.closest('[data-ai]');if(x&&!e.target.closest('a'))zoomAlert(+x.dataset.ai)});
$('#rf').onclick=()=>{loadAlerts();Object.keys(routeCache).forEach(k=>delete routeCache[k]);init(false);loadRoad()};
function planTabs(){$('#plans').innerHTML=PLANS.map(p=>`<button data-p="${p}" class="${p===plan?'on':''}">${p}</button>`).join('')}
$('#plans').onclick=e=>{const p=e.target.dataset?.p;if(!p||p===plan)return;plan=p;try{localStorage.setItem('plan',p)}catch(e){}planTabs();init(false)};
/* ===== 離線 ===== */
let SW=false,TILES=null,tT=0;
const prepAt=()=>{try{return localStorage.getItem('offPrep')}catch(e){return null}};
function offInfo(){
 if(!SW)return'💾 離線功能：這個瀏覽器不支援，或還在啟用中<br>';
 const p=prepAt();
 return`💾 離線：已存地圖圖磚 ${TILES??'…'} 張；行程與路線${p?' '+new Date(p).toLocaleString('zh-TW',{hour12:false})+' 已備妥':'尚未下載（按「📥 準備離線」）'}<br>`}
async function countTiles(){try{TILES=(await (await caches.open('tiles')).keys()).length}catch(e){TILES=null}updateSrc()}
function net(){$('#net').hidden=navigator.onLine}
addEventListener('online',()=>{net();$('#rf').click()});addEventListener('offline',net);net();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./plans.html'}).then(()=>{SW=true;countTiles()}).catch(()=>{});
map.on('moveend',()=>{clearTimeout(tT);tT=setTimeout(countTiles,4000)});
async function prepOffline(){
 const b=$('#off');if(!navigator.onLine){b.textContent='📴 需要網路';setTimeout(()=>b.textContent='📥 準備離線',2500);return}
 b.disabled=true;let bad=0;
 try{
  b.textContent='📥 路況…';await fetch('road.json?t='+Date.now()).catch(()=>bad++);
  await jsonp(SHEET_ID,'景點總覽').catch(()=>bad++);await jsonp(ALERT_ID).catch(()=>{});
  for(const p of PLANS){
   b.textContent='📥 '+p+'…';
   const rows=rowsOf(await jsonp(SHEET_ID,'Plan_'+p)),hi=rows.findIndex(r=>r.some(x=>x.includes('景點')));
   const by={};toStops(hi>=0?rows.slice(hi):rows).forEach(s=>{if(s.geo)(by[s.day]??=[]).push(s)});
   for(const st of Object.values(by))if(st.length>1)await fetch(osrmUrl(st)).catch(()=>bad++);
  }
  try{localStorage.setItem('offPrep',new Date().toISOString())}catch(e){}
  b.textContent=bad?'⚠️ 部分失敗，可再按一次':'✅ 離線資料已備妥';
 }catch(e){b.textContent='⚠️ 失敗，請在有網路時重試'}
 b.disabled=false;updateSrc();setTimeout(()=>b.textContent='📥 準備離線',4000)
}
$('#off').onclick=prepOffline;
planTabs();
init(true);loadRoad();loadAlerts();
setInterval(()=>{loadRoad();loadAlerts()},10*60*1000);
</script>
</body>
